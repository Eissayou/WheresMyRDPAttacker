# =============================================================================
# Azure Static Web Apps - CI/CD Pipeline (GitHub OIDC Authentication)
# =============================================================================
# Deploys the honeypot threat map frontend to Azure Static Web Apps.
# Uses GitHub's native OIDC authentication (no deployment token needed).
#
# Azure Setup Required:
#   1. Go to Azure Portal → Static Web App → Settings → Configuration
#   2. Under "Deployment authorization policy", select "GitHub"
#   3. Make sure you're signed in as the correct GitHub account (Eissayou)
#
# Docs: https://aka.ms/swaworkflowconfig
# =============================================================================

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # Build & Deploy - Runs on push or PR open/update
  # ---------------------------------------------------------------------------
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"          # Root contains index.html
          api_location: ""           # No Azure Functions API
          output_location: "."       # No build step needed (static files)
          skip_app_build: true       # Skip build (pre-built static site)

  # ---------------------------------------------------------------------------
  # Cleanup - Closes staging environment when PR is closed
  # ---------------------------------------------------------------------------
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Staging Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
          app_location: "/"
