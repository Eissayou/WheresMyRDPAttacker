# =============================================================================
# Azure Static Web Apps - CI/CD Pipeline
# =============================================================================
# Deploys the honeypot threat map frontend to Azure Static Web Apps.
# Triggers on pushes to main and pull request events.
#
# Required Secrets:
#   - AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_WAVE_0061ED81E
#
# Docs: https://aka.ms/swaworkflowconfig
# =============================================================================

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------------
  # Build & Deploy - Runs on push or PR open/update
  # ---------------------------------------------------------------------------
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_WAVE_0061ED81E }}
          action: "upload"
          app_location: "/"          # Root contains index.html
          api_location: ""           # No Azure Functions API
          output_location: "."       # No build step needed (static files)
          app_build_command: "true"  # Skip build (pre-built static site)

  # ---------------------------------------------------------------------------
  # Cleanup - Closes staging environment when PR is closed
  # ---------------------------------------------------------------------------
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Staging Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
